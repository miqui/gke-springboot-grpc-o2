name: message-service CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"
      - "Dockerfile"
      - ".github/workflows/message-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"
      - "Dockerfile"
      - ".github/workflows/message-service-ci.yml"
  workflow_dispatch: {}

# Image: us-central1-docker.pkg.dev/<project>/api-images/grpc-message-api (Artifact Registry).
# Pushing authenticates keylessly: GitHub's OIDC token is exchanged through Workload Identity
# Federation for a short-lived token of the ci-pusher service account, which can only write to
# that one repository. The federation provider only accepts tokens for this repo's main branch,
# so pull requests (which never push) can't obtain it either. Set up by gke-deploy.sh, which
# prints the two repository variables below.
env:
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: us-central1-docker.pkg.dev/k8s-dev-412419/api-images/grpc-message-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC token for Workload Identity Federation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Compiles the protos, then unit + integration tests. The integration tests start the whole
      # app against a real Postgres via Testcontainers (the runner's Docker daemon), so Flyway,
      # constraints and optimistic locking run for real; Hazelcast is faked.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        if: github.event_name != 'pull_request'
        id: gcp
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}
          token_format: access_token

      - name: Log in to Artifact Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      # <UTC yyyymmddHHMMSS>-<7-char sha>: sorts lexically by build time (Argo CD Image Updater's
      # "alphabetical" strategy picks the highest tag) while still identifying the commit.
      - name: Compute image tag
        if: github.event_name != 'pull_request'
        id: meta
        run: echo "tag=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # amd64 only: GKE's e2 nodes are x86_64.
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
